<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}" />
</head>
<body>
  <div class="shell">
    <div class="alert alert--error alert--top-spaced" role="alert">
      <strong>{{ title }}</strong><br />{{ message }}
    </div>
    {% if detail %}
      <pre class="error-detail">{{ detail }}</pre>
    {% endif %}
    <p class="footer"><a href="/">Voltar ao dashboard</a></p>
  </div>
</body>
</html>
